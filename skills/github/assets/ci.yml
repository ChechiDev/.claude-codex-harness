name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".editorconfig"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# Every job calls the project's Makefile: the commands, the test selection and the
# coverage threshold are defined there (and in pyproject.toml) once, never here.
# A CI checkout has no harness/ link: only the harness targets need it.

jobs:
# ── Static checks — parallel, no dependencies ────────────────────────────────

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: make lint

  type:
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: make type

  deps:
    name: Dependencies (deptry)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: make deps

  audit:
    name: Vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"
      - run: make audit

# ── Tests — `make test`: everything except the integration/e2e markers, with
#    coverage and the threshold of [tool.coverage.report] ──────────────────────

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, type]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: make test COVERAGE_XML=coverage.xml
      - name: Coverage comment on PR
        uses: MishaKav/pytest-coverage-comment@main
        if: always() && github.event_name == 'pull_request' && hashFiles('coverage.xml') != ''
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Test Coverage

# ── Integration — tests marked `integration`, against real services; only on
#    PRs to main. Drop the services the project does not use. ─────────────────

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, type]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway credentials of the service container above, not secrets.
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: make test-integration
