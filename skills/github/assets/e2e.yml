name: E2E

on:
  workflow_dispatch:
  # schedule:                        # uncomment when e2e tests are stable
  #   - cron: "0 2 * * *"           # daily at 02:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # issues: write                    # uncomment when schedule + failure notification is enabled

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # API_KEY: ${{ secrets.E2E_API_KEY }}
      ENVIRONMENT: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --group test

      - name: Run e2e tests
        run: |
          rc=0
          uv run pytest tests/e2e/ -v || rc=$?
          if [ "$rc" -eq 5 ]; then echo "no e2e tests yet"; exit 0; fi
          exit "$rc"

      # Uncomment when schedule trigger is enabled:
