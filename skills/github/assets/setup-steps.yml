# Canonical setup steps — paste into any job in .github/workflows/ci.yml
# The dev group (synced by default) has every tool; --locked fails on a stale uv.lock.

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup uv + Python 3.12
    uses: astral-sh/setup-uv@v4
    with:
      enable-cache: true
      python-version: "3.12"

  - name: Install dependencies
    run: uv sync --locked
