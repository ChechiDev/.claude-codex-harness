name: Bug
description: Something is broken or behaves unexpectedly
title: "fix(<scope>): <short description>"
labels: ["bug"]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Observed behavior
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: "Command, job type, FBRef URL, player/competition ID"
      render: bash
    validations:
      required: true

  - type: textarea
    id: logs-traceback
    attributes:
      label: Logs / traceback
      render: text
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - scraper
        - parser
        - queue
        - repositories
        - migrations
        - chrome-ext
        - cli
        - ci
        - other
    validations:
      required: true
